name: convert2file
description: Convert2File Android App - Full document generation system
version: 1.0.25+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Database & Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.8.4
  
  # File Picking & Management
  file_picker: ^11.0.2
  open_filex: ^4.3.4
  share_plus: ^12.0.2
  permission_handler: ^12.0.1
  
  # Document Parsing
  # docx_to_text: ^0.0.1
  archive: ^4.0.9
  xml: ^6.5.0
  syncfusion_flutter_pdf: ^33.2.6
  syncfusion_flutter_pdfviewer: ^33.2.6
  
  # Output Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  flutter_html: ^3.0.0-beta.2
  flutter_math_fork: ^0.7.4
  
  # Security
  crypto: ^3.0.3
  
  # UI & Utilities
  intl: ^0.20.2
  flutter_slidable: ^4.0.3
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.0.7
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0
  gal: ^2.3.3
  flutter_zxing: ^3.0.1
  fl_chart: ^1.2.0
  
  # State Management
  provider: ^6.1.1
  
  # Background Processing
  workmanager: ^0.9.0+3
  connectivity_plus: ^7.1.1
  llama_flutter_android: 0.2.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/convert2file_logo.png
    - assets/images/convert2file_logo_v2.png
    - assets/programming_reference.md
    - assets/convert2file_guide.md
  fonts:
    - family: NotoSansMath
      fonts:
        - asset: assets/fonts/NotoSansMath-Regular.ttf
