name: Build Android release APK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Four-part app version, for example 3.0.2.31
        required: true
        type: string
      enforce_minimum:
        description: Require this version to sign in after the release is published
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Validate release version
        id: release_version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a four-part numeric version such as 3.0.2.31"
            exit 1
          fi
          {
            echo "version_name=${RELEASE_VERSION%.*}"
            echo "version_code=${RELEASE_VERSION##*.}"
            echo "release_tag=v${RELEASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Check release configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          NORMALIZED_SHA256="${EXPECTED_SHA256//:/}"
          NORMALIZED_SHA256="${NORMALIZED_SHA256,,}"
          if [[ ! "$NORMALIZED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Set the repository variable ANDROID_SIGNING_CERT_SHA256 to the new key's 64-character SHA-256 fingerprint."
            exit 1
          fi
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "Set the SUPABASE_URL Actions variable and SUPABASE_SECRET_KEY Actions secret."
            exit 1
          fi

      - name: Restore and verify the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/convert2file-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "The decoded Android signing keystore is empty or invalid."
            exit 1
          fi

          EXPECTED_SHA256="${EXPECTED_SHA256//:/}"
          EXPECTED_SHA256="${EXPECTED_SHA256,,}"
          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_STORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD | awk -F': ' '/SHA256:/ { gsub(":", "", $2); print tolower($2); exit }')"
          if [[ -z "$CERT_SHA256" ]]; then
            echo "Could not read the SHA-256 certificate for the configured Android key alias."
            exit 1
          fi
          if [[ "$CERT_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "Configured release keystore does not match the app's existing signing certificate. Stopping before APK build."
            echo "Expected: $EXPECTED_SHA256"
            echo "Found:    $CERT_SHA256"
            exit 1
          fi

          # Creating a CSR forces keytool to decrypt the private key and validates its password before Gradle runs.
          CSR_PATH="$RUNNER_TEMP/convert2file-key-validation.csr"
          if ! keytool -certreq -alias "$ANDROID_KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass:env ANDROID_STORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -file "$CSR_PATH" >/dev/null 2>&1; then
            echo "Could not unlock the release private key. Check ANDROID_KEY_PASSWORD and confirm it matches the keystore key password."
            exit 1
          fi
          rm -f "$CSR_PATH"
          echo "Release keystore fingerprint and private-key password verified."

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/convert2file-release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      - name: Verify APK signing certificate
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android apksigner was not found."
            exit 1
          fi
          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK_PATH" | awk -F': ' '/SHA-256 digest:/ { print tolower($NF); exit }')"
          EXPECTED_SHA256="${EXPECTED_SHA256//:/}"
          EXPECTED_SHA256="${EXPECTED_SHA256,,}"
          if [[ "$CERT_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "APK signing certificate changed. Refusing to publish an incompatible update."
            echo "Expected: $EXPECTED_SHA256"
            echo "Found:    ${CERT_SHA256:-missing}"
            exit 1
          fi
          echo "APK signing certificate matches the active release key."

      - name: Prepare APK for release
        run: cp build/app/outputs/flutter-apk/app-release.apk Convert2File.apk

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$RELEASE_TAG'"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; choose a new version."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" Convert2File.apk --clobber
          else
            gh release create "$RELEASE_TAG" Convert2File.apk \
              --draft \
              --title "Convert2File $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Sync published version to Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ steps.release_version.outputs.release_tag }}
          ENFORCE_MINIMUM: ${{ inputs.enforce_minimum }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$RELEASE_TAG'"
            exit 1
          fi
          # The release is still a draft at this point. GitHub's tag lookup API
          # may omit draft releases, so construct the stable download URL from
          # the release tag and the asset name that was uploaded above.
          APK_DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Convert2File.apk"
          if [[ ! "$APK_DOWNLOAD_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Could not find the APK asset URL on release $RELEASE_TAG."
            exit 1
          fi
          MINIMUM_VERSION=""
          if [[ "${ENFORCE_MINIMUM,,}" == "true" ]]; then
            MINIMUM_VERSION="$RELEASE_VERSION"
          fi
          BODY="$(jq -n --arg latest "v$RELEASE_VERSION" --arg minimum "$MINIMUM_VERSION" --arg apk_url "$APK_DOWNLOAD_URL" \
            '{p_latest_version:$latest,p_minimum_supported_version:(if $minimum == "" then null else $minimum end),p_apk_download_url:$apk_url}')"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/rpc/ci_publish_app_release_version" \
            -X POST \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: Convert2File.apk
          if-no-files-found: error
          retention-days: 14
