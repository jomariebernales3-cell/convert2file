name: Build Android release APK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Four-part app version, for example 3.0.2.31
        required: true
        type: string
      enforce_minimum:
        description: Require this version to sign in after the release is published
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a four-part numeric version such as 3.0.2.31"
            exit 1
          fi
          echo "VERSION_NAME=${RELEASE_VERSION%.*}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${RELEASE_VERSION##*.}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Check release configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Missing repository secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "Set the SUPABASE_URL Actions variable and SUPABASE_SERVICE_ROLE_KEY Actions secret."
            exit 1
          fi

      - name: Restore the existing Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing repository secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build release APK
        run: flutter build apk --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      - name: Prepare APK for release
        run: cp build/app/outputs/flutter-apk/app-release.apk Convert2File.apk

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; choose a new version."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" Convert2File.apk --clobber
          else
            gh release create "$RELEASE_TAG" Convert2File.apk \
              --draft \
              --title "Convert2File $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Sync published version to Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ENFORCE_MINIMUM: ${{ inputs.enforce_minimum }}
        run: |
          MINIMUM_VERSION=""
          if [[ "${ENFORCE_MINIMUM,,}" == "true" ]]; then
            MINIMUM_VERSION="$RELEASE_VERSION"
          fi
          BODY="$(jq -n --arg latest "v$RELEASE_VERSION" --arg minimum "$MINIMUM_VERSION" \
            '{p_latest_version:$latest,p_minimum_supported_version:(if $minimum == "" then null else $minimum end)}')"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/rpc/ci_publish_app_release_version" \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$BODY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: Convert2File.apk
          if-no-files-found: error
          retention-days: 14
